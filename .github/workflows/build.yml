name: Build APK Universal (32 & 64 bits)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar proyecto base
        run: |
          FOUND_SETTINGS=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -n "$FOUND_SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
          else
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto localizado en: $PROJECT_DIR"

      - name: Aplicar zip de actualización si existe
        run: |
          Z=$(find . -maxdepth 2 -iname '*1.9*.zip' -not -path './.git/*' | head -1)
          if [ -z "$Z" ]; then
            Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -1)
          fi
          if [ -n "$Z" ]; then
            echo "Aplicando paquete: $Z -> $PROJECT_DIR"
            rm -rf /tmp/n && mkdir -p /tmp/n
            unzip -qo "$Z" -d /tmp/n
            FOUND=$(find /tmp/n -name settings.gradle.kts | head -1)
            if [ -n "$FOUND" ]; then
              D=$(dirname "$FOUND")
            else
              FOUND_APP=$(find /tmp/n -path '*/app/build.gradle.kts' | head -1)
              D=$(dirname "$(dirname "$FOUND_APP")")
            fi
            if [ -n "$D" ] && [ -d "$D" ]; then
              cp -rf "$D"/. "$PROJECT_DIR"/
            fi
            NEW_SETTINGS=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -1)
            if [ -n "$NEW_SETTINGS" ]; then
              echo "PROJECT_DIR=$(dirname "$NEW_SETTINGS")" >> "$GITHUB_ENV"
            fi
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Compilar APK Universal (armeabi-v7a + arm64-v8a)
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC"
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Verificar assets de Matemática Labs
        run: |
          ls -lh app/src/main/assets/labs/math/ || true
          ls -lh app/src/main/assets/labs/ocr/ || true
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: abstergo-v1.9-universal-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
